{% load streamfield_standalone_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamField Standalone Demo</title>
    {{ form.media.css }}
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f8f8; margin: 0; padding: 0; }
        .page { max-width: 960px; margin: 2rem auto; padding: 0 1.5rem; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; color: #2e1f5e; }
        h2 { font-size: 1.125rem; font-weight: 600; margin: 2rem 0 0.75rem; }
        .submit-btn { margin-top: 1.25rem; background: #2e1f5e; color: #fff; border: none; padding: 0.5rem 1.5rem; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        .submit-btn:hover { background: #1f1342; }
        pre { background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; padding: 1rem; overflow-x: auto; font-size: 0.875rem; }
    </style>
</head>
<body>
    {% streamfield_wagtail_config %}

    <div class="page">
        <h1>StreamField Standalone Demo</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.content }}
            <div>
                <button type="submit" class="submit-btn">Save</button>
            </div>
        </form>

        {% if submitted_json %}
        <div>
            <h2>Saved JSON</h2>
            <pre>{{ submitted_json }}</pre>
        </div>
        {% endif %}
    </div>

    {{ form.media.js }}
</body>
</html>
