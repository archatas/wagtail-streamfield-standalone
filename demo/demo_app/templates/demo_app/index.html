{% load crispy_forms_tags streamfield_standalone_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamField Standalone Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    {{ form.media.css }}
</head>
<body>
    {% streamfield_wagtail_config %}

    <div class="container py-4" style="max-width: 960px;">
        <h1 class="mb-4">StreamField Standalone Demo</h1>

        {% crispy form %}

        {% if submitted_json %}
        <div class="mt-4">
            <h2 class="h5">Saved JSON</h2>
            <pre class="bg-light border rounded p-3" style="font-size: .875rem;">{{ submitted_json }}</pre>
        </div>
        {% endif %}
    </div>

    {{ form.media.js }}
</body>
</html>
