[tox]
envlist =
    py{310,311,312,313}-django52-wagtail80,
    py{312,313,314}-django{60,61}-wagtail80,
    playwright,

isolated_build = true

[testenv]
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    wagtail80: wagtail>=8.0,<8.1
    django-taggit>=5.0
    django-crispy-forms>=2.3
    crispy-bootstrap5>=2024.10
    pytest-django
commands =
    pytest demo/tests/
setenv =
    DJANGO_SETTINGS_MODULE = demo_project.settings
    PYTHONPATH = {toxinidir}/demo

[testenv:playwright]
package = skip
deps =
    Django>=5.2
    wagtail>=8.0
    django-taggit>=5.0
    django-crispy-forms>=2.3
    crispy-bootstrap5>=2024.10
    Pillow
    pytest-django
    pytest-playwright
changedir = {toxinidir}/demo
commands_pre =
    playwright install chromium
commands =
    pytest tests/ -v --browser chromium --screenshot only-on-failure --output tests/screenshots
setenv =
    DJANGO_SETTINGS_MODULE = demo_project.settings
    PYTHONPATH = {toxinidir}/demo:{toxinidir}/src
