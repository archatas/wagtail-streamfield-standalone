[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-streamfield-standalone"
version = "0.1.0"
description = "Embed Wagtail's StreamField editor outside the Wagtail admin"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2",
    "wagtail>=8.0",
]

[project.optional-dependencies]
dev = ["pytest-django"]

[tool.hatch.build.targets.wheel]
packages = ["wagtail_streamfield_standalone"]
